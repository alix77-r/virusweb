<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virus | Scripts Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800;900&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030d05; 
            --card: #061a09; 
            --text-main: #ffffff;
            --accent: #39FF14;
            --btn-txt: #000000;
            --shadow: rgba(0, 0, 0, 0.8);
            --border-color: #123618;
        }

        [data-theme="light"] {
            --bg: #dcfce7; 
            --card: rgba(255, 255, 255, 0.95);
            --text-main: #166534;
            --accent: #22c55e;
            --btn-txt: #ffffff;
            --shadow: rgba(22, 101, 52, 0.1);
            --border-color: #22c55e;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 80px 0;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: var(--card);
            border: 2px solid var(--accent);
            border-radius: 15px;
            cursor: pointer;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px var(--shadow);
        }

        .container { width: 90%; max-width: 440px; text-align: center; }

        .server-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            margin-bottom: 20px;
            box-shadow: 0 0 25px var(--accent);
            object-fit: cover;
            animation: float 4s ease-in-out infinite; 
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            margin: 0;
            background: linear-gradient(90deg, #166534, var(--accent), #86efac, var(--accent), #166534);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: green-rainbow 3s linear infinite;
        }

        @keyframes green-rainbow { to { background-position: 200% center; } }

        .status-badge {
            display: inline-block;
            background: var(--card);
            padding: 8px 25px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 800;
            margin-top: 15px;
            border: 1.5px solid var(--accent);
            box-shadow: 0 4px 10px var(--shadow);
        }

        .mobile-section-box {
            margin-top: 30px;
            padding: 30px 10px 20px 10px;
            border: 2px dashed var(--accent);
            border-radius: 35px;
            background: rgba(34, 197, 94, 0.05);
            position: relative;
        }

        .mobile-title {
            position: absolute;
            top: -15px;
            right: 30px;
            background: var(--accent);
            color: var(--btn-txt);
            padding: 2px 15px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 900;
            box-shadow: 0 4px 10px var(--shadow);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* أنميشن النص للبيسي */
        .pc-discord-text {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--accent);
            padding: 15px 10px;
            margin: 5px 0;
            animation: green-glow 2s ease-in-out infinite alternate;
        }

        @keyframes green-glow {
            0% {
                text-shadow: 0 0 5px rgba(57, 255, 20, 0.4), 0 0 10px rgba(57, 255, 20, 0.2);
                opacity: 0.85;
            }
            100% {
                text-shadow: 0 0 15px rgba(57, 255, 20, 0.9), 0 0 25px rgba(57, 255, 20, 0.6);
                opacity: 1;
            }
        }

        .glass-card {
            background: var(--card);
            border-radius: 25px;
            padding: 20px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.3s ease;
            border: 2px solid var(--border-color);
            box-shadow: 0 5px 15px var(--shadow);
        }

        .glass-card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px var(--accent);
            border-color: var(--accent);
        }

        .hack-logo {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .dl-section {
            max-height: 0;
            overflow: hidden;
            transition: 0.5s ease;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .active .dl-section { max-height: 250px; margin-top: 20px; }

        .btn {
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 900;
            font-size: 0.9rem;
            text-align: center;
        }

        .btn-green { background: var(--accent); color: var(--btn-txt); }
        .btn-outline { border: 2px solid var(--accent); color: var(--accent); }

        .social-container { margin-top: 40px; display: flex; flex-direction: column; gap: 12px; }
        
        .social-btn {
            padding: 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            transition: 0.3s;
        }

        .discord { background: #5865F2; }
        .youtube { background: #FF0000; }
        .tiktok { background: #000000; }

        .footer-tag { margin-top: 40px; font-size: 13px; font-weight: 600; opacity: 0.7; }
        .footer-tag span { color: var(--accent); font-weight: 900; }

    </style>
</head>
<body data-theme="dark">

    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️</button>

    <div class="container">
        <div class="header">
            <img src="https://raw.githubusercontent.com/alix77-r/hdhdhdh/main/file_0000000041b871f4b988bc07e4825813.png" alt="Server Logo" class="server-logo">
            <h1>VIRUS</h1>
            <div class="status-badge">خذ هاكاتك من هنا وريح بالك 😉</div>
        </div>

        <!-- قسم الجوال -->
        <div class="mobile-section-box">
            <div class="mobile-title">📱 هاكات الجوال</div>

            <div class="glass-card" onclick="this.classList.toggle('active')">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <img src="https://i.postimg.cc/CKf1vxr1/63b332c5c6195f61dfae84d81890307c.jpg" alt="Delta Logo" class="hack-logo">
                        <div style="text-align: right;">
                            <b style="display: block; font-size: 1.1rem;">تنزيل هاك دلتا</b>
                            <p style="font-size: 10px; opacity: 0.6; margin: 0;">الأصدار الاخير - آمن - يحتاج مفتاح</p>
                        </div>
                    </div>
                    <div style="opacity: 0.3;">▼</div>
                </div>
                <div class="dl-section">
                    <a href="https://www.mediafire.com/file/vnk8nzp28aqmyde/Delta-2.729.840.apk/file" target="_blank" class="btn btn-green">أندرويد</a>
                    <a href="https://www.mediafire.com/file/0n55ue79xcc06uj/Delta-2.729.838.ipa/file" target="_blank" class="btn btn-outline">أيفون</a>
                </div>
            </div>
        </div>

        <!-- قسم البيسي المحدث -->
        <div class="mobile-section-box" style="margin-top: 40px;">
            <div class="mobile-title">💻 هاكات البيسي</div>
            <div class="pc-discord-text">
                هاكات البيسي موجودة بسيرفر الدسكورد
            </div>
        </div>

        <div class="social-container">
            <a href="https://discord.gg/gHYTPfQtVy" class="social-btn discord" target="_blank">سيرفر الديسكورد</a>
            <a href="https://youtube.com/@virushub5?si=KmvSTvOJUdu3T_Lo" class="social-btn youtube" target="_blank">قناة اليوتيوب</a>
            <a href="https://www.tiktok.com/@virushub_?_r=1&_t=ZS-95o7O7qaUNz" class="social-btn tiktok" target="_blank">حساب التيك توك</a>
        </div>

        <div class="footer-tag">Developed by <span>alimohmed / krov</span></div>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeBtn');
            if (body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
                btn.innerHTML = '☀️';
            } else {
                body.setAttribute('data-theme', 'light');
                btn.innerHTML = '🌙';
            }
        }
    </script>
</body>
</html>
